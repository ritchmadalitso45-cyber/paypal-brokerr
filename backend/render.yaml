databases:
  - name: paypal-broker-db
    databaseName: copilot
    user: copilot
    plan: basic-256mb
services:
  - type: keyvalue
    name: paypal-broker-redis
    plan: starter
    ipAllowList: []
  - type: web
    name: paypal-broker-api
    runtime: docker
    plan: starter
    healthCheckPath: /health/ready
    preDeployCommand: alembic upgrade head
    dockerCommand: uvicorn copilot.api:app --host 0.0.0.0 --port 10000 --no-proxy-headers
    envVars: &env
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: {name: paypal-broker-db, property: connectionString}
      - key: REDIS_URL
        fromService: {name: paypal-broker-redis, type: keyvalue, property: connectionString}
      - key: ADMIN_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
  - type: worker
    name: paypal-broker-worker
    runtime: docker
    plan: starter
    dockerCommand: python -m copilot.worker
    envVars: *env
